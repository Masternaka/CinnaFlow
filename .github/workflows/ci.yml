name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Vérifications statiques
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Outils disponibles
        run: node --version && jq --version

      - name: Vérifications
        run: bash scripts/check.sh
